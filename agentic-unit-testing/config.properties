# ---- LLM provider (any OpenAI-compatible chat-completions endpoint) ----
api.baseUrl=https://openrouter.ai/api/v1
# Name of the environment variable holding the API key (the key itself is never stored here)
api.keyEnv=OPENROUTER_API_KEY
model=qwen/qwen3.8-27b:free
# Tried in order when the primary model is rate-limited (OpenRouter routing; leave empty for other providers)
fallbackModels=google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free

# ---- Sampling settings per agent ----
# Code generator: low temperature -> near-deterministic, "most likely" solution
codegen.temperature=0.2
codegen.topP=0.95
codegen.maxTokens=2048
# Test generator: slightly higher temperature -> more diverse inputs to hit uncovered branches
testgen.temperature=0.4
testgen.topP=0.95
testgen.maxTokens=4096
seed=42

# ---- Testing goal (coverage criterion) ----
# STATEMENT (JaCoCo line coverage) or BRANCH (JaCoCo branch / decision coverage)
criterion=BRANCH
# Required coverage in percent
target=100
# Max test-generation rounds per task (1 initial + feedback rounds with uncovered lines)
maxTestIterations=3
# Max code-generation attempts if the generated code does not compile
maxCodeAttempts=2

# ---- Dataset / execution ----
dataset=data/humaneval_java.jsonl
# Tasks to run: comma-separated ids or ranges, e.g. 0-9 or 0,5,12
tasks=0-9
# Timeout for compiling / running generated code (seconds)
execTimeoutSeconds=30
# Pause between LLM calls (ms) to stay within free-tier rate limits
requestDelayMs=3000
runsDir=runs
