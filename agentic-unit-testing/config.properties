# ---- LLM (OpenRouter, OpenAI-compatible API). The key is read from the OPENROUTER_API_KEY environment variable. ----
api.baseUrl=https://openrouter.ai/api/v1
model=qwen/qwen3.8-27b:free
seed=42

# ---- Code generator agent ----
codegen.temperature=0.2
codegen.topP=0.95
codegen.maxTokens=2048

# ---- Test case generator agent ----
testgen.temperature=0.4
testgen.topP=0.95
testgen.maxTokens=4096

# ---- Testing goal: user-specified coverage criterion ----
# STATEMENT (every statement executed) or BRANCH (every decision outcome taken)
criterion=BRANCH
# Required coverage in percent
target=100
# Test-generation rounds per task (1 initial + feedback rounds with uncovered lines)
maxTestIterations=3
